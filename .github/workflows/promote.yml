# Cross-workflow chained promotion.
# When CI finishes successfully on `staging` or `preprod`, open (or update) a
# promotion PR to the next stage in the chain:
#   staging -> preprod -> main
# Triggered by the CI workflow completing, so promotion only happens on green.
name: promote

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [staging, preprod]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-promotion-pr:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open the next-stage promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.event.workflow_run.head_branch }}
        run: |
          # Map each source branch to the next stage.
          case "$SOURCE" in
            staging) TARGET=preprod ;;
            preprod) TARGET=main ;;
            *) echo "No promotion mapping for '$SOURCE'."; exit 0 ;;
          esac
          echo "Promotion: $SOURCE -> $TARGET"

          git fetch origin "$TARGET" "$SOURCE" --quiet

          if [ -z "$(git rev-list origin/$TARGET..origin/$SOURCE)" ]; then
            echo "$SOURCE is not ahead of $TARGET; nothing to promote."
            exit 0
          fi

          existing=$(gh pr list --base "$TARGET" --head "$SOURCE" --state open \
            --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            echo "Promotion PR #$existing ($SOURCE -> $TARGET) is already open."
            exit 0
          fi

          ahead=$(git rev-list --count origin/$TARGET..origin/$SOURCE)
          gh pr create --base "$TARGET" --head "$SOURCE" \
            --title "Promote $SOURCE to $TARGET ($ahead commit(s))" \
            --body "Automated promotion PR opened after CI passed on \`$SOURCE\`.

          Carries $ahead commit(s) into \`$TARGET\`. Merging advances the chain (staging -> preprod -> main); reaching main triggers the production deploy, gated by the \`production\` environment protection rule."
          echo "Opened $SOURCE -> $TARGET promotion PR."
