# Cross-workflow forked promotion.
# When CI finishes successfully on a source branch, open (or update) a
# promotion PR to EACH of its downstream targets:
#   staging -> develop AND preprod   (parallel fan-out)
#   preprod -> main
# Triggered by the CI workflow completing, so promotion only happens on green.
name: promote

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [staging, preprod]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-promotion-prs:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open promotion PR(s) to each downstream target
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.event.workflow_run.head_branch }}
        run: |
          # Each source fans out to one or more targets (space-separated).
          case "$SOURCE" in
            staging) TARGETS="develop preprod" ;;
            preprod) TARGETS="main" ;;
            *) echo "No promotion mapping for '$SOURCE'."; exit 0 ;;
          esac
          echo "Promoting $SOURCE -> [$TARGETS]"

          for TARGET in $TARGETS; do
            git fetch origin "$TARGET" "$SOURCE" --quiet

            if [ -z "$(git rev-list origin/$TARGET..origin/$SOURCE)" ]; then
              echo "$SOURCE is not ahead of $TARGET; skipping."
              continue
            fi

            existing=$(gh pr list --base "$TARGET" --head "$SOURCE" --state open \
              --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$existing" ]; then
              echo "Promotion PR #$existing ($SOURCE -> $TARGET) already open."
              continue
            fi

            ahead=$(git rev-list --count origin/$TARGET..origin/$SOURCE)
            gh pr create --base "$TARGET" --head "$SOURCE" \
              --title "Promote $SOURCE to $TARGET ($ahead commit(s))" \
              --body "Automated promotion PR opened after CI passed on \`$SOURCE\`.

          Carries $ahead commit(s) into \`$TARGET\`. \`staging\` fans out to both \`develop\` and \`preprod\` in parallel; \`preprod\` promotes to \`main\`, whose merge triggers the production deploy (gated by the \`production\` environment protection rule)."
            echo "Opened $SOURCE -> $TARGET promotion PR."
          done
