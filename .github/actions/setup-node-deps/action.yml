name: "Setup Node & deps"
description: "Sets up Node with npm cache and installs dependencies. Assumes the repo is already checked out."

inputs:
  node-version:
    description: "Node.js version to install"
    required: false
    default: "20"

runs:
  using: "composite"
  steps:
    - name: Set up Node ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"

    - name: Install dependencies
      shell: bash
      run: npm ci
